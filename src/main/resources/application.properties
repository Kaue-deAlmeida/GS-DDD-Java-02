spring.application.name=ondacare
server.port=${PORT:8080}

# Configuracao Oracle FIAP (defina nas variaveis de ambiente do IntelliJ e do Render)
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${ORACLE_USER:seu_rm}
spring.datasource.password=${ORACLE_PASSWORD:sua_senha}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
